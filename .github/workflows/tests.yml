name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sh scripts/check_public_surface.sh
      - run: python3 -m unittest discover -v
      - run: swiftc -typecheck native/App.swift
