[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daw-project-cleaner"
version = "0.11.0"
description = "Local, safety-first project archive scanner and quarantine tool for Cubase and Nuendo users"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Franck Reisner / Studio89"}]
dependencies = []

[project.urls]
Homepage = "https://buymeacoffee.com/franckreisner"

[project.scripts]
daw-project-cleaner = "daw_project_cleaner.cli:main"

[tool.setuptools.packages.find]
include = ["daw_project_cleaner*"]
